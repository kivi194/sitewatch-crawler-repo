name: SiteWatch Priority Tests
on:
  schedule:
    # Runs daily at 07:00 UTC — fast (~2 min), checks critical transaction paths
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "Domain to test (e.g. israelpharm.com). Leave empty to test all sites."
        required: false
        default: ""
jobs:
  priority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright browsers
        run: playwright install chromium --with-deps
      - name: Run priority tests
        env:
          CRAWLER_INGEST_SECRET: ${{ secrets.CRAWLER_INGEST_SECRET }}
          SITE_FILTER: ${{ inputs.site }}
          TEST_MODE: priority
        run: python checker.py
