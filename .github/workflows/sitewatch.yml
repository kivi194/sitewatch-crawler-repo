name: SiteWatch Crawler
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: site-health-checker/requirements.txt
      - name: Install dependencies
        run: pip install -r site-health-checker/requirements.txt
      - name: Run crawler
        env:
          CRAWLER_INGEST_SECRET: ${{ secrets.CRAWLER_INGEST_SECRET }}
        run: python site-health-checker/checker.py
