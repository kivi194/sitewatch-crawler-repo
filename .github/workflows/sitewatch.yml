name: SiteWatch Crawler
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "Domain to scan (e.g. israelpharm.com). Leave empty to scan all sites."
        required: false
        default: ""
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright browsers
        run: playwright install chromium --with-deps
      - name: Run crawler
        env:
          CRAWLER_INGEST_SECRET: ${{ secrets.CRAWLER_INGEST_SECRET }}
          SITE_FILTER: ${{ inputs.site }}
        run: python checker.py
